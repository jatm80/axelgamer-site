<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Battle Demo — Pixel Gorillas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 20%, #23366b 0%, #12162f 48%, #070914 100%);
    color: #ffe7a1;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .shell {
    width: min(980px, 100%);
    background: rgba(8, 10, 24, 0.92);
    border: 2px solid #ffc857;
    box-shadow: 0 0 24px rgba(255, 200, 87, 0.25), inset 0 0 22px rgba(255, 200, 87, 0.08);
    padding: 14px;
  }
  h1 {
    margin: 0 0 10px;
    text-align: center;
    letter-spacing: 0.12em;
    font-size: clamp(1rem, 3vw, 1.6rem);
    text-transform: uppercase;
    color: #ffd166;
    text-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid rgba(255, 200, 87, 0.75);
    background: #111936;
    image-rendering: pixelated;
    touch-action: none;
  }
  .panel {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
    font-size: clamp(0.75rem, 2vw, 0.95rem);
  }
  .mobile-controls {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .mobile-controls button {
    min-height: 46px;
    border-radius: 10px;
    touch-action: manipulation;
  }
  .mobile-controls .throw-control {
    background: #ffd166;
    color: #18122b;
    font-weight: 900;
  }
  .mobile-help {
    display: none;
    margin: 8px 0 0;
    text-align: center;
    color: #ffe7a1;
    font-size: 0.8rem;
  }
  .panel strong { color: #7dd3fc; }
  .center { text-align: center; color: #ffedb3; }
  .right { text-align: right; }
  button {
    font: inherit;
    background: #181d3e;
    color: #ffd166;
    border: 1px solid #ffd166;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover { background: #273064; }
  @media (max-width: 680px) {
    body { align-items: flex-start; padding: 8px; }
    .shell { padding: 10px; }
    .panel { grid-template-columns: 1fr; text-align: center; }
    .right { text-align: center; }
    .mobile-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mobile-controls .throw-control { grid-column: 1 / -1; }
    .mobile-help { display: block; }
  }
</style>
</head>
<body>
  <main class="shell">
    <h1>🍌 Banana Battle Drawing Demo</h1>
    <canvas id="game" width="900" height="520" aria-label="Canvas demo showing procedurally drawn buildings, gorillas, banana arc, wind and explosion"></canvas>
    <div class="panel">
      <div><strong>Demo:</strong> procedural skyline + canvas gorillas</div>
      <div class="center">A/D angle · W/S power · Space throw · R reset</div>
      <div class="right"><button id="reset">New skyline</button></div>
    </div>
    <div class="mobile-controls" aria-label="Mobile game controls">
      <button type="button" data-action="angle-down" aria-label="Aim lower">Angle −</button>
      <button type="button" data-action="angle-up" aria-label="Aim higher">Angle +</button>
      <button type="button" data-action="power-down" aria-label="Reduce power">Power −</button>
      <button type="button" data-action="power-up" aria-label="Increase power">Power +</button>
      <button type="button" class="throw-control" data-action="throw" aria-label="Throw banana">Throw 🍌</button>
    </div>
    <p class="mobile-help">Mobile: use the buttons to aim and throw. Tap the canvas to throw too.</p>
  </main>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const resetButton = document.getElementById('reset');
  const W = canvas.width;
  const H = canvas.height;
  const groundY = H - 20;

  const palette = {
    skyTop: '#151f55',
    skyMid: '#42336e',
    skyBottom: '#f08b47',
    sun: '#ffd166',
    windowOn: '#ffe28a',
    windowOff: '#17203d',
    outline: '#130c14',
    banana: '#ffe033'
  };

  let buildings = [];
  const MIN_ANGLE = 10;
  const MAX_ANGLE = 80;
  const MIN_POWER = 25;
  const MAX_POWER = 160;

  let players = [];
  let banana = null;
  let particles = [];
  let activePlayer = 0;
  let angle = 42;
  let power = 80;
  let wind = 0;
  let lastTime = 0;
  let message = 'Procedural art demo: buildings, gorillas, banana arc, wind, hit particles.';

  function rand(min, max) { return min + Math.random() * (max - min); }
  function pick(items) { return items[Math.floor(Math.random() * items.length)]; }
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

  function createWindows(x, y, width, height) {
    const windows = [];
    const cellW = 15;
    const cellH = 17;
    for (let wy = y + 17; wy < y + height - 16; wy += cellH) {
      for (let wx = x + 10; wx < x + width - 10; wx += cellW) {
        if (Math.random() > 0.28) {
          windows.push({ x: wx, y: wy, lit: Math.random() > 0.38 });
        }
      }
    }
    return windows;
  }

  function createBuildings() {
    const colors = ['#20254a', '#29305c', '#303765', '#252b52', '#363453', '#1f314f'];
    const list = [];
    let x = 0;
    while (x < W) {
      const width = Math.floor(rand(50, 86));
      const height = Math.floor(rand(120, 310));
      const y = groundY - height;
      list.push({
        x,
        y,
        width,
        height,
        color: pick(colors),
        roof: Math.random() > 0.65 ? pick(['antenna', 'tank', 'sign']) : 'flat',
        windows: createWindows(x, y, width, height)
      });
      x += width;
    }
    return list;
  }

  function topCenter(building) {
    return { x: building.x + building.width / 2, y: building.y };
  }

  function choosePlayerBuildings() {
    const leftIndex = 1 + Math.floor(Math.random() * 2);
    const rightIndex = buildings.length - 3 - Math.floor(Math.random() * 2);
    const leftTop = topCenter(buildings[leftIndex]);
    const rightTop = topCenter(buildings[rightIndex]);
    players = [
      { x: leftTop.x, y: leftTop.y - 28, facing: 1, score: 0, name: 'P1' },
      { x: rightTop.x, y: rightTop.y - 28, facing: -1, score: 0, name: 'P2' }
    ];
  }

  function resetScene() {
    buildings = createBuildings();
    choosePlayerBuildings();
    banana = null;
    particles = [];
    activePlayer = 0;
    angle = 42;
    power = 80;
    wind = Math.round(rand(-18, 18)) / 10;
    message = 'Use controls or press Space to throw. This is a drawing/physics demo, not the full game yet.';
  }

  function drawSky() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, palette.skyTop);
    gradient.addColorStop(0.55, palette.skyMid);
    gradient.addColorStop(1, palette.skyBottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255, 247, 204, 0.85)';
    for (let i = 0; i < 58; i++) {
      const x = (i * 157) % W;
      const y = 18 + ((i * 73) % 165);
      const s = 1 + (i % 3);
      ctx.fillRect(x, y, s, s);
    }

    ctx.fillStyle = palette.sun;
    ctx.shadowColor = palette.sun;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(W - 110, 86, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    drawCloud(170, 92, 1.0);
    drawCloud(610, 132, 0.72);
  }

  function drawCloud(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.arc(-24, 8, 16, 0, Math.PI * 2);
    ctx.arc(-5, 0, 23, 0, Math.PI * 2);
    ctx.arc(20, 9, 18, 0, Math.PI * 2);
    ctx.rect(-38, 8, 78, 18);
    ctx.fill();
    ctx.restore();
  }

  function drawBuilding(b) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.width, b.height);

    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(b.x + 4, b.y, 7, b.height);

    ctx.strokeStyle = 'rgba(10, 10, 24, 0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.width - 2, b.height - 1);

    for (const win of b.windows) {
      ctx.fillStyle = win.lit ? palette.windowOn : palette.windowOff;
      ctx.fillRect(win.x, win.y, 7, 8);
      if (win.lit) {
        ctx.fillStyle = 'rgba(255,226,138,0.18)';
        ctx.fillRect(win.x - 1, win.y - 1, 9, 10);
      }
    }

    drawRoofDetail(b);
  }

  function drawRoofDetail(b) {
    ctx.strokeStyle = '#101225';
    ctx.fillStyle = '#222741';
    ctx.lineWidth = 3;
    if (b.roof === 'antenna') {
      const cx = b.x + b.width * 0.72;
      ctx.beginPath();
      ctx.moveTo(cx, b.y);
      ctx.lineTo(cx, b.y - 22);
      ctx.moveTo(cx - 9, b.y - 13);
      ctx.lineTo(cx + 9, b.y - 20);
      ctx.stroke();
    } else if (b.roof === 'tank') {
      ctx.fillRect(b.x + b.width * 0.18, b.y - 10, 24, 10);
      ctx.strokeRect(b.x + b.width * 0.18, b.y - 10, 24, 10);
    } else if (b.roof === 'sign') {
      ctx.fillStyle = '#f97316';
      ctx.fillRect(b.x + 10, b.y - 12, Math.min(34, b.width - 20), 9);
    }
  }

  function drawGorilla(x, y, facing, throwingArm) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing, 1);

    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 27, 27, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2b1914';
    ctx.strokeStyle = palette.outline;
    ctx.lineWidth = 2;

    // legs
    ctx.fillRect(-16, 15, 11, 17);
    ctx.fillRect(5, 15, 11, 17);

    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // belly
    ctx.fillStyle = '#70442b';
    ctx.beginPath();
    ctx.ellipse(0, 7, 13, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    // head and ears
    ctx.fillStyle = '#2b1914';
    ctx.beginPath();
    ctx.arc(-14, -31, 7, 0, Math.PI * 2);
    ctx.arc(14, -31, 7, 0, Math.PI * 2);
    ctx.arc(0, -29, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // face
    ctx.fillStyle = '#91603d';
    ctx.beginPath();
    ctx.ellipse(0, -26, 11, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#050506';
    ctx.fillRect(-6, -31, 3, 3);
    ctx.fillRect(3, -31, 3, 3);
    ctx.fillRect(-5, -22, 10, 2);

    // arms; active player's throwing arm raises a little
    ctx.strokeStyle = '#2b1914';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-15, -5);
    ctx.lineTo(-30, throwingArm ? -25 : 13);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(15, -5);
    ctx.lineTo(30, 13);
    ctx.stroke();

    if (throwingArm) {
      drawBanana(-34, -31, -0.65);
    }

    ctx.restore();
  }

  function drawBanana(x, y, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.strokeStyle = palette.banana;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0.18, Math.PI - 0.18);
    ctx.stroke();
    ctx.strokeStyle = '#7a4b00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-13, 2);
    ctx.lineTo(-17, 5);
    ctx.moveTo(13, 2);
    ctx.lineTo(17, 5);
    ctx.stroke();
    ctx.restore();
  }

  function drawAimingGuide() {
    if (banana) return;
    const p = players[activePlayer];
    const dir = p.facing;
    const radians = angle * Math.PI / 180;
    const startX = p.x + dir * 28;
    const startY = p.y - 36;
    const vx = Math.cos(radians) * dir * power * 0.9;
    const vy = -Math.sin(radians) * power * 0.9;

    ctx.strokeStyle = 'rgba(255, 244, 190, 0.5)';
    ctx.setLineDash([6, 7]);
    ctx.beginPath();
    for (let t = 0; t < 1.6; t += 0.12) {
      const x = startX + vx * t + wind * t * t * 5;
      const y = startY + vy * t + 85 * t * t;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function throwBanana() {
    if (banana) return;
    const p = players[activePlayer];
    const radians = angle * Math.PI / 180;
    banana = {
      x: p.x + p.facing * 28,
      y: p.y - 36,
      vx: Math.cos(radians) * p.facing * power * 0.018,
      vy: -Math.sin(radians) * power * 0.018,
      rotation: 0
    };
    message = players[activePlayer].name + ' throws! Wind is ' + wind.toFixed(1) + '.';
  }

  function spawnExplosion(x, y, color) {
    for (let i = 0; i < 34; i++) {
      const a = rand(0, Math.PI * 2);
      const speed = rand(45, 170);
      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life: rand(0.35, 0.8),
        maxLife: 0.8,
        color: color || pick(['#ffd166', '#f97316', '#fb7185', '#fde68a'])
      });
    }
  }

  function update(dt) {
    if (banana) {
      banana.vx += wind * dt * 0.06;
      banana.vy += 2.3 * dt;
      banana.x += banana.vx * dt * 60;
      banana.y += banana.vy * dt * 60;
      banana.rotation += dt * 9;

      const target = players[1 - activePlayer];
      const dx = banana.x - target.x;
      const dy = banana.y - (target.y - 12);
      if (dx * dx + dy * dy < 30 * 30) {
        spawnExplosion(banana.x, banana.y, '#ffd166');
        players[activePlayer].score += 1;
        message = 'Hit! ' + players[activePlayer].name + ' scores. Press Space to throw again.';
        banana = null;
        activePlayer = 1 - activePlayer;
        return;
      }

      const hitBuilding = buildings.some(b => banana.x >= b.x && banana.x <= b.x + b.width && banana.y >= b.y && banana.y <= groundY);
      if (hitBuilding || banana.x < -30 || banana.x > W + 30 || banana.y > H + 30) {
        if (hitBuilding) spawnExplosion(banana.x, banana.y, '#f97316');
        message = 'Miss. Other gorilla\'s turn.';
        banana = null;
        activePlayer = 1 - activePlayer;
      }
    }

    particles = particles.filter(p => {
      p.life -= dt;
      p.vy += 200 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      return p.life > 0;
    });
  }

  function drawParticles() {
    for (const p of particles) {
      const alpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawWindFlag() {
    ctx.save();
    ctx.translate(W / 2, 56);
    ctx.strokeStyle = '#dbeafe';
    ctx.fillStyle = wind >= 0 ? '#7dd3fc' : '#f0abfc';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 38);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.lineTo(wind * 12, 10);
    ctx.lineTo(0, 18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '14px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('wind ' + wind.toFixed(1), 0, -10);
    ctx.restore();
  }

  function drawHud() {
    ctx.save();
    ctx.fillStyle = 'rgba(7,9,20,0.72)';
    ctx.fillRect(12, 12, 320, 82);
    ctx.strokeStyle = 'rgba(255,209,102,0.55)';
    ctx.strokeRect(12, 12, 320, 82);
    ctx.fillStyle = '#ffe7a1';
    ctx.font = '16px Courier New, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Turn: ' + players[activePlayer].name + '   Score ' + players[0].score + ' - ' + players[1].score, 26, 36);
    ctx.fillText('Angle: ' + angle + '°   Power: ' + power, 26, 58);
    ctx.fillStyle = '#bde7ff';
    ctx.fillText(message, 26, 80);
    ctx.restore();
  }

  function render() {
    drawSky();
    drawWindFlag();
    for (const b of buildings) drawBuilding(b);
    drawAimingGuide();
    players.forEach((p, i) => drawGorilla(p.x, p.y, p.facing, i === activePlayer && !banana));
    if (banana) drawBanana(banana.x, banana.y, banana.rotation);
    drawParticles();
    drawHud();
  }

  function loop(timestamp) {
    const dt = Math.min(0.033, (timestamp - lastTime) / 1000 || 0.016);
    lastTime = timestamp;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  let ignoreNextSyntheticClick = false;

  function handleControlAction(action) {
    if (action === 'reset') resetScene();
    if (action === 'throw') throwBanana();
    if (action === 'angle-up') angle = clamp(angle + 2, MIN_ANGLE, MAX_ANGLE);
    if (action === 'angle-down') angle = clamp(angle - 2, MIN_ANGLE, MAX_ANGLE);
    if (action === 'power-up') power = clamp(power + 2, MIN_POWER, MAX_POWER);
    if (action === 'power-down') power = clamp(power - 2, MIN_POWER, MAX_POWER);
  }

  window.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) event.preventDefault();
    if (key === 'r') handleControlAction('reset');
    if (event.key === ' ' || key === 'enter') handleControlAction('throw');
    if (key === 'a' || event.key === 'ArrowLeft') handleControlAction('angle-up');
    if (key === 'd' || event.key === 'ArrowRight') handleControlAction('angle-down');
    if (key === 'w' || event.key === 'ArrowUp') handleControlAction('power-up');
    if (key === 's' || event.key === 'ArrowDown') handleControlAction('power-down');
  });

  document.querySelectorAll('[data-action]').forEach((button) => {
    button.addEventListener('touchstart', (event) => {
      event.preventDefault();
      ignoreNextSyntheticClick = true;
      handleControlAction(button.dataset.action);
    }, { passive: false });
    button.addEventListener('click', () => {
      if (ignoreNextSyntheticClick) {
        ignoreNextSyntheticClick = false;
        return;
      }
      handleControlAction(button.dataset.action);
    });
  });

  canvas.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    handleControlAction('throw');
  });
  resetButton.addEventListener('click', () => handleControlAction('reset'));

  resetScene();
  requestAnimationFrame(loop);
}());
</script>
</body>
</html>
