<section class="section games-section" id="games">
  <div class="container">
    <div class="section-heading games-header">
      <p class="eyebrow">Play zone</p>

      <p>First up: a retro Snake challenge. Grab snacks, dodge yourself, and don’t hit the walls.</p>
    </div>

    <div class="games-grid" aria-live="polite">
      <article class="video-card game-card">
        <a class="game-thumb snake-thumb" href="{{ `/games/snake/` | relURL }}" aria-label="Play Snake">

            <span class="snake-pixel snake-pixel-1"></span>

            <span>Arcade</span>

          <div class="video-actions">
            <a class="card-btn primary" href="{{ `/games/snake/` | relURL }}">Play Snake</a>
