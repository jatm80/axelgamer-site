<div id="video-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
  <div class="modal-backdrop" data-close-modal="true"></div>
  <div class="modal-dialog">
    <button class="modal-close" type="button" aria-label="Close video player" data-close-modal="true">×</button>
    <h2 id="modal-title">Now playing</h2>
    <div class="video-frame-wrap">
      <iframe
        id="video-player"
        src=""
        title="AxelGamer video player"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
    <p><a id="video-link" href="#" target="_blank" rel="noopener noreferrer">Open on YouTube</a></p>
  </div>
</div>
