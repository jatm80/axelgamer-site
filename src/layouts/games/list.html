{{ define "main" }}
<main class="section">
  <div class="container">
    <div class="section-heading">
      <p class="eyebrow">Play zone</p>
      <h1>{{ .Title }}</h1>
      <div class="about-copy">{{ .Content }}</div>
    </div>
    <div class="games-grid">
      {{ range .RegularPages.ByWeight }}
      <article class="video-card game-card">
        <div class="video-body">
          <p class="eyebrow">{{ .Params.genre }}</p>
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          <p>{{ .Description }}</p>
          <div class="video-meta"><span>{{ .Params.controls }}</span></div>
          <div class="video-actions"><a class="card-btn primary" href="{{ .RelPermalink }}">Play {{ .Title }}</a></div>
        </div>
      </article>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
