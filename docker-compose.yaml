services:
  hugo:
    image: hugomods/hugo:exts-0.125.7
    working_dir: /src
    command:
      - hugo
      - server
      - --bind
      - 0.0.0.0
      - --baseURL
      - http://localhost:1313
      - --appendPort=false
      - --disableFastRender
    ports:
      - "1313:1313"
    volumes:
      - ./src:/src

  hugo-build:
    image: hugomods/hugo:exts-0.125.7
    working_dir: /src
    command:
      - hugo
    volumes:
      - ./src:/src
    profiles:
      - build
